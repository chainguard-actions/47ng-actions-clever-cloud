name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**/*.ts"
      - "!src/**/*.test.ts"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"

permissions: {}

jobs:
  build:
    name: Deploy on Docker
    # Previews only run on this repo's own branches, never forks. Fork PRs use the
    # `pull_request` trigger with a read-only token and no secrets, so they cannot
    # push images or read secrets; this guard just skips them cleanly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.docker-tag.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
      digest: ${{ steps.docker-build-push.outputs.digest }}
      tags: ${{ steps.docker-labels-tags.outputs.tags }}
      labels: ${{ steps.docker-labels-tags.outputs.labels }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Get PR head SHA
        id: sha
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          safe=$(printf '%s' "$PR_HEAD_SHA" | tr -d '\n\r')
          echo "sha=$safe" >> "$GITHUB_OUTPUT"

      - name: Get Docker tag
        id: docker-tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          safe=$(printf '%s' "$PR_NUMBER" | tr -d '\n\r')
          echo "tag=pr-$safe" >> "$GITHUB_OUTPUT"

      - name: Get package version
        id: package
        run: |
          VERSION=$(jq -r '
            .version |
            if test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$")
            then .
            else error("Invalid semver format in package.json")
            end
          ' package.json 2>&1)

          if [ $? -ne 0 ]; then
            echo "::error::$VERSION" # Expand the error into an annotation
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Collect Docker labels & tags
        id: docker-labels-tags
        env:
          PKG_VERSION: ${{ steps.package.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ steps.sha.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DOCKER_TAG: ${{ steps.docker-tag.outputs.tag }}
        run: |
          safe_pkg_version=$(printf '%s' "$PKG_VERSION" | tr -d '\n\r')
          safe_pr_number=$(printf '%s' "$PR_NUMBER" | tr -d '\n\r')
          safe_pr_sha=$(printf '%s' "$PR_SHA" | tr -d '\n\r')
          safe_repository=$(printf '%s' "$REPOSITORY" | tr -d '\n\r')
          safe_run_id=$(printf '%s' "$RUN_ID" | tr -d '\n\r')
          safe_docker_tag=$(printf '%s' "$DOCKER_TAG" | tr -d '\n\r')
          echo 'labels<<__LABELS_EOF__' >> "$GITHUB_OUTPUT"
          echo "org.opencontainers.image.title=47ng/actions-clever-cloud" >> "$GITHUB_OUTPUT"
          echo "org.opencontainers.image.description=GitHub action to deploy to Clever Cloud (PR preview)" >> "$GITHUB_OUTPUT"
          echo "org.opencontainers.image.version=${safe_pkg_version}-pr.${safe_pr_number}" >> "$GITHUB_OUTPUT"
          echo "org.opencontainers.image.revision=${safe_pr_sha}" >> "$GITHUB_OUTPUT"
          echo "org.opencontainers.image.licenses=MIT" >> "$GITHUB_OUTPUT"
          echo "org.opencontainers.image.source=https://github.com/${safe_repository}/tree/${safe_pr_sha}" >> "$GITHUB_OUTPUT"
          echo "org.opencontainers.image.documentation=https://github.com/${safe_repository}/pull/${safe_pr_number}" >> "$GITHUB_OUTPUT"
          echo "org.opencontainers.image.url=https://github.com/${safe_repository}/actions/runs/${safe_run_id}" >> "$GITHUB_OUTPUT"
          echo '__LABELS_EOF__' >> "$GITHUB_OUTPUT"
          echo 'tags<<__TAGS_EOF__' >> "$GITHUB_OUTPUT"
          echo "ghcr.io/47ng/actions-clever-cloud:${safe_docker_tag}" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/47ng/actions-clever-cloud:git-${safe_pr_sha}" >> "$GITHUB_OUTPUT"
          echo '__TAGS_EOF__' >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker-build-push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          labels: "${{ steps.docker-labels-tags.outputs.labels }}"
          tags: "${{ steps.docker-labels-tags.outputs.tags }}"
          push: true

      - name: Generate step summary
        env:
          DIGEST: ${{ steps.docker-build-push.outputs.digest }}
          TAGS: ${{ steps.docker-labels-tags.outputs.tags }}
          LABELS: ${{ steps.docker-labels-tags.outputs.labels }}
        run: |
          echo "## 🐳 &nbsp;Docker image" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📌 &nbsp;Tags" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${TAGS}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🏷 &nbsp;Labels" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${LABELS}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

  # Isolated so the only `pull-requests: write` token in the workflow lives in a
  # job that runs no untrusted code (it never checks out the PR). All values are
  # passed via env, never interpolated into the script.
  comment:
    name: Comment on PR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ needs.build.outputs.tags }}
          LABELS: ${{ needs.build.outputs.labels }}
        with:
          script: |
            const tag = process.env.TAG;
            const sha = process.env.SHA;
            const digest = process.env.DIGEST;
            const tags = process.env.TAGS;
            const labels = process.env.LABELS;
            const marker = "<!-- docker-build-comment -->";

            const body = [
              marker,
              "## 🐳 &nbsp;Docker image preview",
              "",
              "Preview this PR in your workflow:",
              "",
              "```yaml",
              "# Use the PR number to follow changes in this PR",
              `- uses: docker://ghcr.io/47ng/actions-clever-cloud:${tag}`,
              "",
              "# Use the git SHA for pinning to a specific commit",
              `- uses: docker://ghcr.io/47ng/actions-clever-cloud:git-${sha}`,
              "```",
              "",
              "<details>",
              "<summary>Image metadata</summary>",
              "",
              `Digest: \`${digest}\``,
              "",
              "### 📌 &nbsp;Tags",
              "```",
              tags,
              "```",
              "",
              "### 🏷 &nbsp;Labels",
              "```",
              labels,
              "```",
              "",
              "</details>",
              "",
              "---",
              "<sub>🤖 This comment is updated on every push</sub>",
            ].join("\n");

            // Find existing comment by marker
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              (comment) => comment.body && comment.body.startsWith(marker),
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
