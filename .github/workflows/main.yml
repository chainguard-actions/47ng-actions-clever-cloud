name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [created, published, edited]
  push:
    branches:
      - master
      - "releases/*"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Check version consistency
        run: |
          set +e # We want to handle errors ourselves to provide better messages
          PACKAGE_VERSION=$(jq -r '
            .version |
            if test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$")
            then .
            else error("Invalid semver format in package.json")
            end
          ' package.json 2>&1)
          JQ_EXIT_CODE=$?

          if [ $JQ_EXIT_CODE -ne 0 ]; then
            echo "::error::Invalid semver version in package.json"
            exit 2
          fi

          ACTION_TAG=$(grep 'image: docker://ghcr.io' action.yml | sed 's/.*://g' | grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$')
          GREP_EXIT_CODE=$?
          set -e # Re-enable exit on error

          if [ $GREP_EXIT_CODE -ne 0 ] || [ -z "$ACTION_TAG" ]; then
            echo "::error::Invalid or missing version format in action.yml"
            exit 3
          fi

          if [ "$PACKAGE_VERSION" != "$ACTION_TAG" ]; then
            echo "::error::Version mismatch! package.json has $PACKAGE_VERSION but action.yml has $ACTION_TAG"
            exit 4
          fi

          echo "✅ Versions match: $PACKAGE_VERSION"
      - name: Run knip
        run: pnpm run knip

  ci:
    name: Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run integration tests
        run: pnpm run test

  cd:
    name: Deployment
    # Only run for push events (master, releases) and releases
    if: github.event_name != 'pull_request'
    needs: [ci, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Get Git SHA
        id: sha
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          safe=$(printf '%s' "$GIT_SHA" | tr -d '\n\r')
          echo "sha=$safe" >> "$GITHUB_OUTPUT"
      - name: Get Docker tag
        id: docker-tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref="$REF_NAME"
          tag=$(                        \
            echo "$ref"                 \
            | sed 's#refs/heads/##g'    \
            | sed 's#refs/tags/##g'     \
            | tr '/' '_'                \
            | tr -d '#'                 \
          )
          if [ "$tag" == "master" ]; then
            tag="latest"
          fi
          safe=$(printf '%s' "$tag" | tr -d '\n\r')
          echo "tag=$safe" >> "$GITHUB_OUTPUT"
      - id: package
        run: |
          VERSION=$(jq -r '
            .version |
            if test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-ZaZ.-]+)?(\\+[0-9A-ZaZ.-]+)?$")
            then .
            else error("Invalid semver format in package.json")
            end
          ' package.json 2>&1)

          if [ $? -ne 0 ]; then
            echo "::error::$VERSION" # Expand the error into an annotation
            exit 1
          fi

          safe=$(printf '%s' "$VERSION" | tr -d '\n\r')
          echo "version=$safe" >> "$GITHUB_OUTPUT"
      - name: Collect Docker labels & tags
        id: docker-labels-tags
        env:
          PKG_VERSION: ${{ steps.package.outputs.version }}
          GIT_SHA: ${{ steps.sha.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          DOCKER_TAG: ${{ steps.docker-tag.outputs.tag }}
        run: |
          safe_pkg_version=$(printf '%s' "$PKG_VERSION" | tr -d '\n\r')
          safe_git_sha=$(printf '%s' "$GIT_SHA" | tr -d '\n\r')
          safe_repository=$(printf '%s' "$REPOSITORY" | tr -d '\n\r')
          safe_run_id=$(printf '%s' "$RUN_ID" | tr -d '\n\r')
          safe_ref_name=$(printf '%s' "$REF_NAME" | tr -d '\n\r')
          safe_docker_tag=$(printf '%s' "$DOCKER_TAG" | tr -d '\n\r')
          echo 'labels<<__LABELS_EOF__' >> "$GITHUB_OUTPUT"
          echo "org.opencontainers.image.title=47ng/actions-clever-cloud" >> "$GITHUB_OUTPUT"
          echo "org.opencontainers.image.description=GitHub action to deploy to Clever Cloud" >> "$GITHUB_OUTPUT"
          printf 'org.opencontainers.image.version=%s\n' "$safe_pkg_version" >> "$GITHUB_OUTPUT"
          printf 'org.opencontainers.image.revision=%s\n' "$safe_git_sha" >> "$GITHUB_OUTPUT"
          echo "org.opencontainers.image.licenses=MIT" >> "$GITHUB_OUTPUT"
          printf 'org.opencontainers.image.source=https://github.com/%s/tree/%s\n' "$safe_repository" "$safe_git_sha" >> "$GITHUB_OUTPUT"
          printf 'org.opencontainers.image.documentation=https://github.com/%s/blob/master/packages/server/README.md\n' "$safe_repository" >> "$GITHUB_OUTPUT"
          printf 'org.opencontainers.image.url=https://github.com/%s/actions/runs/%s\n' "$safe_repository" "$safe_run_id" >> "$GITHUB_OUTPUT"
          echo '__LABELS_EOF__' >> "$GITHUB_OUTPUT"
          echo 'tags<<__TAGS_EOF__' >> "$GITHUB_OUTPUT"
          if [ "$safe_ref_name" == "master" ]; then
            printf 'ghcr.io/47ng/actions-clever-cloud:%s\n' "$safe_pkg_version" >> "$GITHUB_OUTPUT"
            printf '47ng/actions-clever-cloud:%s\n' "$safe_pkg_version" >> "$GITHUB_OUTPUT"
          fi
          printf 'ghcr.io/47ng/actions-clever-cloud:%s\n' "$safe_docker_tag" >> "$GITHUB_OUTPUT"
          printf 'ghcr.io/47ng/actions-clever-cloud:git-%s\n' "$safe_git_sha" >> "$GITHUB_OUTPUT"
          printf '47ng/actions-clever-cloud:%s\n' "$safe_docker_tag" >> "$GITHUB_OUTPUT"
          printf '47ng/actions-clever-cloud:git-%s\n' "$safe_git_sha" >> "$GITHUB_OUTPUT"
          echo '__TAGS_EOF__' >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker-build-push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          labels: "${{ steps.docker-labels-tags.outputs.labels }}"
          tags: "${{ steps.docker-labels-tags.outputs.tags }}"
          push: true
      - name: Generate step summary
        env:
          DIGEST: ${{ steps.docker-build-push.outputs.digest }}
          TAGS: ${{ steps.docker-labels-tags.outputs.tags }}
          LABELS: ${{ steps.docker-labels-tags.outputs.labels }}
        run: |
          echo "## 🐳 &nbsp;Docker image" >> "$GITHUB_STEP_SUMMARY"
          printf 'Digest: `%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📌 &nbsp;Tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### 🏷 &nbsp;Labels" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$LABELS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
