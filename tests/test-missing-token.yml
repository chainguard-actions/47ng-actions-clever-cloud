name: Test missing CLEVER_TOKEN error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          appID: app_00000000-0000-0000-0000-000000000000
        # Deliberately NOT setting CLEVER_TOKEN or CLEVER_SECRET
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CLEVER_TOKEN is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CLEVER_TOKEN is missing"
