name: Test missing Clever Cloud credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          appID: app_00000000-0000-0000-0000-000000000000
      - name: Assert action failed without CLEVER_TOKEN/CLEVER_SECRET
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TIMED_OUT: ${{ steps.action.outputs.timedOut }}
        run: |
          echo "outcome: $OUTCOME"
          echo "timedOut: $TIMED_OUT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when credentials are missing"
            exit 1
          fi
          if [ "$TIMED_OUT" = "true" ]; then
            echo "FAIL: timedOut should not be true"
            exit 1
          fi
          echo "PASS"
