name: Test shallow copy detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Intentionally use a shallow checkout (fetch-depth: 1) to trigger the
      # shallow copy detection in the action.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # Provide fake credentials so the action gets past the credential check
      # and reaches the shallow copy detection logic.
      - id: action
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
        env:
          CLEVER_TOKEN: fake-token-for-testing
          CLEVER_SECRET: fake-secret-for-testing
        continue-on-error: true

      - name: Assert action failed due to shallow copy
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to shallow copy, but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly detected shallow copy and failed"
