name: Test timedOut output default value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
        continue-on-error: true
        # No credentials — action will fail, but timedOut output is set at the very start
      - name: Assert timedOut output is false
        env:
          TIMED_OUT: ${{ steps.action.outputs.timedOut }}
        run: |
          echo "timedOut output: $TIMED_OUT"
          if [ "$TIMED_OUT" != "false" ]; then
            echo "FAIL: expected timedOut to be 'false', got '$TIMED_OUT'"
            exit 1
          fi
          echo "PASS: timedOut is 'false' as expected"
