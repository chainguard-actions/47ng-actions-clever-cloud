name: Test force flag input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with force=true (expect failure - no credentials)
        id: action
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          force: 'true'
        env:
          CLEVER_TOKEN: ''
          CLEVER_SECRET: ''
        continue-on-error: true

      - name: Assert action failed (not due to bad input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (force flag accepted, failed at auth)"
