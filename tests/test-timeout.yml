name: Test timeout input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          timeout: '30'
        continue-on-error: true
      - name: Assert action was invoked with timeout input
        run: |
          echo "Action completed (with or without error due to missing credentials)"
          echo "PASS: timeout input was accepted"
