name: Test invalid deployPath error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          deployPath: this/path/does/not/exist
        env:
          CLEVER_TOKEN: fake-token-for-testing
          CLEVER_SECRET: fake-secret-for-testing
        continue-on-error: true
      - name: Assert action failed due to invalid deployPath
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when deployPath does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent deployPath"
