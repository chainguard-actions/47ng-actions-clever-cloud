name: Test invalid deployPath error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Provide credentials and a non-existent deployPath.
      # The action should fail with "Deploy path does not exist".
      # Note: the action will attempt to run 'clever login' before checking the
      # deployPath, so it will fail at the login step with fake credentials —
      # but the important thing is that the action fails (not succeeds).
      - id: action
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          deployPath: this-path-does-not-exist
        env:
          CLEVER_TOKEN: fake-token-for-testing
          CLEVER_SECRET: fake-secret-for-testing
        continue-on-error: true

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid deployPath, but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid deployPath"
