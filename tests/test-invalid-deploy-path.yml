name: Test invalid deployPath error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          deployPath: this/path/does/not/exist
        env:
          CLEVER_TOKEN: fake-token-for-path-test
          CLEVER_SECRET: fake-secret-for-path-test
      - name: Assert action failed due to invalid deployPath
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid deployPath, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid deployPath"
