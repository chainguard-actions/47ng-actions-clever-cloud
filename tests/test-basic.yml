name: Test basic deploy invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires real Clever Cloud credentials to succeed.
      # Without them it exits non-zero; we capture that and assert the
      # outcome is not 'success' (i.e. the action ran and failed as expected).
      - id: deploy
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
        continue-on-error: true
        env:
          CLEVER_TOKEN: fake-token
          CLEVER_SECRET: fake-secret

      - name: Assert action ran and failed gracefully (no credentials)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail without valid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action did not succeed without valid credentials (outcome=$OUTCOME)"
