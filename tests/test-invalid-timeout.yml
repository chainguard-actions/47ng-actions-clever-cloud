name: Test invalid timeout error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # The action should fail with an invalid timeout error before even
      # checking credentials (timeout is validated in parseConfig after creds).
      # Actually, credentials are checked first, so we provide fake creds to
      # reach the timeout validation path.
      - id: action
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          timeout: not-a-number
        continue-on-error: true
        env:
          CLEVER_TOKEN: fake-token-for-timeout-test
          CLEVER_SECRET: fake-secret-for-timeout-test

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid timeout, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid timeout value"
