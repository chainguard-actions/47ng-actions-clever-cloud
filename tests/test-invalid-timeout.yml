name: Test invalid timeout input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        env:
          CLEVER_TOKEN: dummy-token-value
          CLEVER_SECRET: dummy-secret-value
        with:
          alias: my-app
          timeout: not-a-number
      - name: Assert action rejected the invalid timeout
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for an invalid timeout value"
            exit 1
          fi
          echo "PASS"
