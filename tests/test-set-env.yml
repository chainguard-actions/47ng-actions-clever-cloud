name: Test setEnv input for extra environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with setEnv input (expect failure without credentials)
        id: deploy
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          setEnv: |
            MY_VAR=hello
            ANOTHER_VAR=world
        env:
          CLEVER_TOKEN: fake-token
          CLEVER_SECRET: fake-secret
        continue-on-error: true
      - name: Assert action was invoked and failed due to auth (not config)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (invalid credentials), not skip or be misconfigured
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action was invoked with setEnv and failed as expected"
