name: Test force deploy with alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with force flag and alias (expect failure without credentials)
        id: deploy
        uses: .
        with:
          alias: my-app-alias
          force: 'true'
        env:
          CLEVER_TOKEN: fake-token
          CLEVER_SECRET: fake-secret
        continue-on-error: true
      - name: Assert action was invoked and failed due to auth (not config)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (invalid credentials/app not found), not skip
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action was invoked with force=true and alias, failed as expected"
