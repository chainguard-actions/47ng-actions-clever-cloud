name: Test missing CLEVER_SECRET error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Provide CLEVER_TOKEN but not CLEVER_SECRET.
      # The action should fail with an error about the missing CLEVER_SECRET env var.
      - id: action
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
        env:
          CLEVER_TOKEN: fake-token-for-testing
        continue-on-error: true

      - name: Assert action failed due to missing CLEVER_SECRET
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing CLEVER_SECRET, but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when CLEVER_SECRET is missing"
