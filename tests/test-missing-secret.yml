name: Test missing CLEVER_SECRET only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        env:
          CLEVER_TOKEN: dummy-token-value
        with:
          alias: my-app
      - name: Assert action failed without CLEVER_SECRET
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when CLEVER_SECRET is missing"
            exit 1
          fi
          echo "PASS"
