name: Test missing CLEVER_SECRET error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
        env:
          CLEVER_TOKEN: fake-token-for-testing
          # No CLEVER_SECRET set — action must fail
        continue-on-error: true
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when CLEVER_SECRET is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when CLEVER_SECRET is missing"
