name: Test logFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create log file directory
        run: mkdir -p /tmp/clever-logs
      - id: action
        uses: .
        continue-on-error: true
        env:
          CLEVER_TOKEN: fake-token
          CLEVER_SECRET: fake-secret
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          logFile: /tmp/clever-logs/deploy.log
      - name: Assert action ran with logFile input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action will fail because credentials are fake,
          # but we just need to confirm the logFile input was accepted
          # (i.e., the action started and didn't reject the input itself)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted logFile input and ran (outcome: ${{ steps.action.outcome }})"
