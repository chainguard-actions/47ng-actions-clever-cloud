name: Test logFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create log directory
        run: mkdir -p "$GITHUB_WORKSPACE/logs"
      - id: action
        uses: .
        continue-on-error: true
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          logFile: ${{ github.workspace }}/logs/clever-cloud-deploy.log
        env:
          CLEVER_TOKEN: fake-token
          CLEVER_SECRET: fake-secret
      - name: Assert action ran with logFile input
        run: |
          echo "Action completed (with or without error due to fake credentials)"
          echo "PASS: logFile input was accepted"
