name: Test logFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - name: Create log directory
        run: mkdir -p "$GITHUB_WORKSPACE/logs"
      - id: deploy
        uses: .
        continue-on-error: true
        with:
          logFile: ${{ github.workspace }}/logs/clever-cloud-deploy.log
        env:
          CLEVER_TOKEN: fake-token
          CLEVER_SECRET: fake-secret
      - name: Assert action ran (logFile input accepted, failed gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Clever Cloud credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
