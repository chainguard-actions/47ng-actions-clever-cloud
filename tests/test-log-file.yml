name: Test logFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create log file directory
        run: mkdir -p /tmp/clever-logs
      - id: action
        uses: .
        continue-on-error: true
        with:
          appID: app-00000000-0000-0000-0000-000000000000
          logFile: /tmp/clever-logs/deploy.log
      - name: Assert action ran (credentials missing is expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail due to missing Clever Cloud credentials.
          # What matters is that the logFile input was accepted and the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with logFile input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
