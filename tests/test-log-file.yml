name: Test logFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          logFile: /tmp/deployment.log
      - name: Assert action ran (credentials missing is expected)
        run: |
          echo "Action completed (with or without error due to missing credentials)"
          echo "PASS: logFile input was accepted"
