name: Test sameCommitPolicy input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          sameCommitPolicy: ignore
        env:
          CLEVER_TOKEN: ''
          CLEVER_SECRET: ''
      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed sameCommitPolicy input and failed at authentication"
