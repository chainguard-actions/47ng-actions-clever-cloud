name: Test sameCommitPolicy input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with sameCommitPolicy=ignore (expect failure - no credentials)
        id: action-ignore
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          sameCommitPolicy: ignore
        env:
          CLEVER_TOKEN: ''
          CLEVER_SECRET: ''
        continue-on-error: true

      - name: Assert action failed with sameCommitPolicy=ignore
        env:
          OUTCOME: ${{ steps.action-ignore.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (sameCommitPolicy=ignore accepted, failed at auth)"

      - name: Run action with sameCommitPolicy=restart (expect failure - no credentials)
        id: action-restart
        uses: .
        with:
          appID: app_00000000-0000-0000-0000-000000000000
          sameCommitPolicy: restart
        env:
          CLEVER_TOKEN: ''
          CLEVER_SECRET: ''
        continue-on-error: true

      - name: Assert action failed with sameCommitPolicy=restart
        env:
          OUTCOME: ${{ steps.action-restart.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (sameCommitPolicy=restart accepted, failed at auth)"
