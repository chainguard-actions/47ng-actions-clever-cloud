name: Test quiet mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with quiet=true (expect failure due to missing credentials)
        id: action
        uses: .
        with:
          appID: app-00000000-0000-0000-0000-000000000000
          quiet: 'true'
        continue-on-error: true
        env:
          CLEVER_TOKEN: ""
          CLEVER_SECRET: ""
      - name: Assert action failed (quiet flag accepted, credentials still missing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when credentials are missing (quiet=true), but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with quiet=true and missing credentials"
