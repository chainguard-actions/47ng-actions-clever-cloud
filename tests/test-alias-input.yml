name: Test alias input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        continue-on-error: true
        env:
          CLEVER_TOKEN: ""
          CLEVER_SECRET: ""
        with:
          alias: my-app-alias
          appID: app_00000000-0000-0000-0000-000000000000
      - name: Assert action failed due to missing credentials (not due to alias input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded (no real credentials)"
          fi
          # The test passes as long as the action ran (even if it failed due to missing credentials)
          # The important thing is that the 'alias' input was accepted
          echo "PASS: alias input was accepted by the action"
