name: Test alias input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with alias input (expect failure due to missing credentials)
        id: action
        uses: .
        with:
          alias: my-app-alias
        continue-on-error: true
        env:
          CLEVER_TOKEN: ""
          CLEVER_SECRET: ""
      - name: Assert action failed (alias accepted, credentials still missing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when credentials are missing (alias input), but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with alias input and missing credentials"
